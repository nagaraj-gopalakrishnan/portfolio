<!doctype html>
<html lang="en">
  <head>
    <!-- ✅ Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ✅ Title (SEO Optimized) -->
    <title>
      Nagaraj Gopalakrishnan | Full Stack & Mobile App Developer – React, Flutter, React Native, Laravel, Fintech & SaaS
    </title>

    <!-- ✅ Meta Description (appears in Google results) -->
    <meta
      name="description"
      content="Portfolio of Nagaraj Gopalakrishnan, a Full Stack & Mobile App Developer building cross-platform Android & iOS apps with Flutter and React Native, plus fintech, SaaS, and enterprise web platforms using React, Next.js, Node.js, and Laravel."
    />

    <!-- ✅ Keywords (helps search intent, optional but useful for niche SEO) -->
    <meta
      name="keywords"
      content="Nagaraj Gopalakrishnan, Full Stack Developer Dubai, Mobile App Developer, Flutter Developer, React Native Developer, Android Developer, iOS Developer, React Developer, Next.js, Node.js, Laravel Developer, Fintech, SaaS, Software Engineer UAE"
    />

    <!-- ✅ Author -->
    <meta name="author" content="Nagaraj Gopalakrishnan" />

    <!-- ✅ Robots -->
    <meta name="robots" content="index, follow" />

    <!-- ✅ Open Graph (Social Preview for LinkedIn, Facebook, etc.) -->
    <meta property="og:title" content="Nagaraj Gopalakrishnan | Full Stack & Mobile App Developer" />
    <meta
      property="og:description"
      content="Full Stack & Mobile App Developer building Android & iOS apps with Flutter and React Native, plus fintech, SaaS, and enterprise web platforms with React, Next.js, and Laravel."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nagaraj-gopalakrishnan.netlify.app/" />
    <meta property="og:image" content="https://nagaraj-gopalakrishnan.netlify.app/preview.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nagaraj Gopalakrishnan | Full Stack & Mobile App Developer" />
    <meta
      name="twitter:description"
      content="Building cross-platform Android & iOS apps with Flutter and React Native, plus fintech, SaaS, and enterprise web platforms."
    />
    <meta name="twitter:image" content="https://nagaraj-gopalakrishnan.netlify.app/preview.jpg" />

   
    <!-- ✅ Theme Color (browser UI color on mobile) -->
    <meta name="theme-color" content="#181A20" />

    <!-- ✅ Canonical Link (avoids duplicate SEO content) -->
    <link rel="canonical" href="https://nagaraj-gopalakrishnan.netlify.app/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

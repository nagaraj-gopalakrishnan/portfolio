<!doctype html>
<html lang="en">
  <head>
    <!-- ✅ Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Favicon -->
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->

    <!-- ✅ Title (SEO Optimized) -->
    <title>
      Nagaraj Gopalakrishnan | Senior Full Stack Developer & Cybersecurity Enthusiast – React, Node.js, Laravel Portfolio
    </title>

    <!-- ✅ Meta Description (appears in Google results) -->
    <meta
      name="description"
      content="Portfolio of Nagaraj Gopalakrishnan, a Senior Full Stack Developer & Cybersecurity Enthusiast specializing in React, Node.js, Laravel, and AI integrations. Explore projects in E-Commerce, WMS, HRMS, and enterprise solutions."
    />

    <!-- ✅ Keywords (helps search intent, optional but useful for niche SEO) -->
    <meta
      name="keywords"
      content="Nagaraj Gopalakrishnan, Full Stack Developer Dubai, React Developer, Node.js Developer, Laravel Developer, Cybersecurity, Web Developer Portfolio, Software Engineer UAE"
    />

    <!-- ✅ Author -->
    <meta name="author" content="Nagaraj Gopalakrishnan" />

    <!-- ✅ Robots -->
    <meta name="robots" content="index, follow" />

    <!-- ✅ Open Graph (Social Preview for LinkedIn, Facebook, etc.) -->
    <meta property="og:title" content="Nagaraj Gopalakrishnan | Senior Full Stack Developer & Cybersecurity Enthusiast" />
    <meta
      property="og:description"
      content="Explore the professional portfolio of Nagaraj Gopalakrishnan — Senior Full Stack Developer specializing in React, Node.js, Laravel, and AI projects."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nagaraj-gopalakrishnan.netlify.app/" />
    <meta property="og:image" content="https://nagaraj-gopalakrishnan.netlify.app/preview.jpg" />
    <meta property="og:locale" content="en_US" />

   
    <!-- ✅ Theme Color (browser UI color on mobile) -->
    <meta name="theme-color" content="#181A20" />

    <!-- ✅ Canonical Link (avoids duplicate SEO content) -->
    <link rel="canonical" href="https://nagaraj-gopalakrishnan.netlify.app/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
